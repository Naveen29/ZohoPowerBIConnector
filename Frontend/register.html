<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Zoho Power BI Connector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light sticky-top shadow-sm">
        <div class="container py-3">
            <a class="navbar-brand" href="index.html">Zoho Power BI Connector</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="btn btn-primary ms-3" href="index.html">Home</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card p-4 shadow-sm auth-card">
                    <div class="mb-4 text-center">
                        <h1 class="h3">Create your account</h1>
                        <p class="text-muted">Register to manage Zoho credentials, subscriptions, and dashboard access.</p>
                    </div>

                    <div id="authAlert" class="alert d-none" role="alert"></div>

                    <form id="registerForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="registerFullName" class="form-label">Full name</label>
                                <input type="text" class="form-control" id="registerFullName" placeholder="Your name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="registerEmail" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="registerEmail" placeholder="name@company.com" required>
                            </div>
                        </div>
                        <div class="row g-3 mt-3">
                            <div class="col-md-6">
                                <label for="registerPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="registerPassword" placeholder="Create a password" required>
                            </div>
                            <div class="col-md-6">
                                <label for="registerConfirmPassword" class="form-label">Confirm password</label>
                                <input type="password" class="form-control" id="registerConfirmPassword" placeholder="Confirm password" required>
                            </div>
                        </div>
                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-primary">Register</button>
                        </div>
                    </form>

                                        <div id="otpArea" class="d-none">
                                            <hr />
                                            <h6 class="mb-2">Email verification</h6>
                                            <p class="text-muted">Enter the 6-digit code sent to your email to complete registration.</p>
                                            <div class="row g-3 align-items-center">
                                                <div class="col-md-6">
                                                    <input id="otpInput" class="form-control" type="text" maxlength="6" placeholder="Enter OTP">
                                                </div>
                                                <div class="col-md-6 text-end">
                                                    <button id="verifyOtpBtn" class="btn btn-success">Verify OTP</button>
                                                    <button id="resendOtpBtn" class="btn btn-link">Resend code</button>
                                                </div>
                                            </div>
                                            <div id="otpAlert" class="alert d-none mt-3" role="alert"></div>
                                        </div>

                    <p class="text-center text-muted mb-0 mt-4">Already have an account? <a href="login.html">Sign in</a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script>
    <script src="register.js"></script>
</body>
</html>
