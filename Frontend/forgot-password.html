<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Zoho Power BI Connector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light sticky-top shadow-sm">
        <div class="container py-3">
            <a class="navbar-brand" href="index.html">Zoho Power BI Connector</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="btn btn-primary ms-3" href="register.html">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center gy-4">
            <div class="col-lg-6">
                <div class="card p-4 shadow-sm auth-card">
                    <div class="mb-4 text-center">
                        <h1 class="h3">Reset your password</h1>
                        <p class="text-muted">Enter your email to receive reset instructions.</p>
                    </div>

                    <div id="authAlert" class="alert d-none" role="alert"></div>

                    <form id="forgotForm">
                        <div class="mb-3">
                            <label for="forgotEmail" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="forgotEmail" placeholder="name@company.com" required>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary">Send reset link</button>
                        </div>
                    </form>

                    <p class="text-center text-muted mb-0 mt-4">Remember your password? <a href="login.html">Sign in</a></p>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card p-4 shadow-sm auth-card">
                    <div class="mb-4 text-center">
                        <h2 class="h5">Complete password reset</h2>
                        <p class="text-muted">Enter the reset token and choose a new password.</p>
                    </div>

                    <form id="resetForm">
                        <div class="mb-3">
                            <label for="resetEmail" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="resetEmail" placeholder="name@company.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="resetToken" class="form-label">Reset token</label>
                            <input type="text" class="form-control" id="resetToken" placeholder="Enter reset token" required>
                        </div>
                        <div class="mb-3">
                            <label for="resetPassword" class="form-label">New password</label>
                            <input type="password" class="form-control" id="resetPassword" placeholder="New password" required>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary">Reset password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
