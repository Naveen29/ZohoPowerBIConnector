<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | Zoho Power BI Connector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light sticky-top shadow-sm">
        <div class="container py-3">
            <a class="navbar-brand" href="index.html">Zoho Power BI Connector</a>
            <div class="ms-auto">
                <a class="btn btn-primary" href="login.html">Back to Login</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card p-4 shadow-sm auth-card">
                    <div class="mb-4 text-center">
                        <h1 class="h3">Verify your email</h1>
                        <p class="text-muted">Enter the OTP sent to your email to activate your account.</p>
                    </div>

                    <div id="verifyAlert" class="alert d-none" role="alert"></div>

                    <form id="verifyForm">
                        <div class="mb-3">
                            <label for="verifyEmail" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="verifyEmail" placeholder="name@company.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="verifyOtp" class="form-label">OTP code</label>
                            <input type="text" class="form-control" id="verifyOtp" placeholder="Enter OTP" maxlength="6" required>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <button type="submit" class="btn btn-success">Verify Email</button>
                            <button id="resendOtpButton" type="button" class="btn btn-link">Resend OTP</button>
                        </div>
                    </form>

                    <p class="text-center text-muted mb-0">Already verified? <a href="login.html">Login now</a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="verify-email.js"></script>
</body>
</html>
